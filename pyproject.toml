[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "filelib"
version = "0.0.1"
description = "A utility library of file-handling functions reused across my projects."
requires-python = ">=3.9"
authors = [
    { name = "Tao Jing", email = "tao.jing.astro@gmail.com" },
]

dependencies = [
    "requests",
    "puremagic",
    "image_complete",
]

[project.scripts]
filelib = "filelib.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
# the skills tree ships with the distribution — an installed package whose
# skills directory came out empty is a landing defect. Explicit patterns:
# code files (__init__/__main__) ship as package code, everything else as data
"filelib.skills" = ["SKILL-DEPLOY.md", "filelib/meta.yaml", "filelib/skill/**/*"]
